<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0a12">
  <title>Burbuja</title>
  <link rel="icon" href="./burbuja/favicon.svg">
  <style>
    html,body{margin:0;min-height:100%;background:#0d0a12;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    body{min-height:100dvh;display:grid;place-items:center}
    .open{display:grid;justify-items:center;gap:10px}
    .bubble{font-size:34px}
    .text{font-size:13px;color:#cdbfca}
  </style>
</head>
<body>
  <div class="open"><div class="bubble">🫧</div><div class="text">Abriendo Burbuja…</div></div>
  <script>
    (async()=>{
      try{
        const parts=location.pathname.split('/').filter(Boolean);
        const isGithubProject=location.hostname.endsWith('github.io') && parts.length>0;
        const repoRoot=isGithubProject?`/${parts[0]}/`:'/';
        const burbujaScope=`${repoRoot}burbuja/`;

        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(r=>{
            try{
              const p=new URL(r.scope).pathname;
              return p===repoRoot || p===burbujaScope;
            }catch{return false}
          }).map(r=>r.unregister()));
        }

        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>{
            const n=k.toLowerCase();
            return n.startsWith('burbuja-root') || n.startsWith('burbuja-shell');
          }).map(k=>caches.delete(k)));
        }
      }catch{}

      const q=new URLSearchParams(location.search);
      q.set('b','20260903-clean');
      const suffix=q.toString()?`?${q.toString()}`:'';
      location.replace(`./burbuja/${suffix}${location.hash||''}`);
    })();
  </script>
</body>
</html>
